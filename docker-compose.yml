version: '3.8'

services:
  # Local Ollama Inference Host
  ollama:
    image: ollama/ollama:latest
    container_name: reliai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_KEEP_ALIVE=24h
    networks:
      - reliai-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  # Python Uvicorn Investigation Harness Service
  ai-harness:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reliai-ai-harness
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      # Persist SQLite database across container restarts
      - ./reliai.db:/app/reliai.db
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=gemma2:latest
      - OLLAMA_VISION_MODEL=qwen2.5-vl:latest
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:8001
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - reliai-net

volumes:
  ollama_models:

networks:
  reliai-net:
    driver: bridge
